<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Siden finnes ikke – TrekkSjekk</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FBFAFC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15131B" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" href="/bilder/ikon-64.png">
<link rel="apple-touch-icon" href="/bilder/ikon-180.png">
<style>
@font-face{font-family:"Poppins";src:url("/fonter/poppins-regular.woff") format("woff");font-weight:400;font-display:swap}
@font-face{font-family:"Poppins";src:url("/fonter/poppins-bold.woff") format("woff");font-weight:700;font-display:swap}
:root{--ground:#FBFAFC;--surface:#fff;--ink:#1C1A22;--muted:#5E5A6B;--accent:#5B3FD6;--hairline:#E4E0EC}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ground:#15131B;--surface:#1D1A25;--ink:#EEEBF4;--muted:#A7A1B8;--accent:#AC99F7;--hairline:#2E2939}}
:root[data-theme="dark"]{--ground:#15131B;--surface:#1D1A25;--ink:#EEEBF4;--muted:#A7A1B8;--accent:#AC99F7;--hairline:#2E2939}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--ground);color:var(--ink);font:16px/1.6 "Poppins",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px 16px}
main{max-width:480px;width:100%;background:var(--surface);border:1px solid var(--hairline);border-radius:22px;padding:32px 24px;text-align:center}
img{width:72px;height:72px;border-radius:18px}
h1{font-size:26px;line-height:1.2;margin:18px 0 8px}
p{color:var(--muted);margin:0 0 20px}
a.knapp{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;font-weight:700;padding:13px 22px;border-radius:999px;min-height:48px}
nav{margin-top:18px;font-size:14px}
nav a{color:var(--muted)}
form{margin:20px 0 0}
input{width:100%;font:inherit;color:var(--ink);background:var(--ground);border:1.5px solid var(--hairline);border-radius:14px;padding:12px 16px}
</style>
</head>
<body>
<main>
  <img src="/bilder/ikon-180.png" alt="TrekkSjekk-ikonet" width="72" height="72">
  <h1>Den siden finnes ikke</h1>
  <p>Lenken kan være gammel, eller så har vi flyttet på noe. Leter du etter en oppsigelsesguide, finner du alle her:</p>
  <a class="knapp" href="/si-opp/">Alle oppsigelsesguider</a>
  <form action="/si-opp/" method="get">
    <label for="q" hidden>Søk etter tjeneste</label>
    <input id="q" name="q" type="search" placeholder="Søk, f.eks. Netflix" autocomplete="off">
  </form>
  <nav><a href="/">Forsiden</a> · <a href="/om.html">Om TrekkSjekk</a> · <a href="/personvern.html">Personvern</a></nav>
</main>
</body>
</html>
